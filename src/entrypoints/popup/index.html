<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mountain Project Korea</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="/icon/128.png" alt="MP KOREA" width="44" height="44" />
        <div>
          <strong>Mountain Project Korea</strong>
          <p>한국어 번역과 탐색</p>
        </div>
      </header>
      <label class="setting">
        <span>확장 기능</span>
        <span class="setting-value">
          <span id="state">확인 중</span>
          <input id="enabled" type="checkbox" role="switch" aria-label="확장 기능" disabled />
        </span>
      </label>
      <p id="status" role="status" aria-live="polite">설정을 불러오는 중입니다.</p>
      <p id="error" role="alert" hidden></p>
      <a id="destination" class="destination" target="_blank" rel="noopener">
        대한민국 지역 열기
      </a>
      <footer>
        <a href="https://github.com/jeongjong10/mountain-project-korea-extension#readme" target="_blank" rel="noopener">사용 안내</a>
        <a href="mailto:whdduf972@gmail.com">문의</a>
        <span id="version"></span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
